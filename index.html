      // 3. 점수 계산 로직 (동점 시 맞대결 문항 우선)
      function calculateResult(answers) {
        const scores = { plan: 0, dev: 0, design: 0, data: 0 };

        for (const q of QUESTIONS) {
          const selected = answers[q.id];
          if (selected) scores[selected] += 1;
        }

        const maxScore = Math.max(...Object.values(scores));
        const tiedTop = JOB_TYPE_ORDER.filter((id) => scores[id] === maxScore);
        let winnerId = tiedTop[0];

        if (tiedTop.length > 1) {
          const headToHead = { plan: 0, dev: 0, design: 0, data: 0 };
          for (const q of QUESTIONS) {
            const tA = q.options[0].type;
            const tB = q.options[1].type;
            if (tiedTop.includes(tA) && tiedTop.includes(tB)) {
              const chosen = answers[q.id];
              if (chosen && tiedTop.includes(chosen)) {
                headToHead[chosen] += 1;
              }
            }
          }
          const bestHead = Math.max(...tiedTop.map((id) => headToHead[id]));
          const afterHead = tiedTop.filter((id) => headToHead[id] === bestHead);

          if (afterHead.length === 1) {
            winnerId = afterHead[0];
          } else {
            for (let i = QUESTIONS.length - 1; i >= 0; i -= 1) {
              const chosen = answers[QUESTIONS[i].id];
              if (chosen && afterHead.includes(chosen)) {
                winnerId = chosen;
                break;
              }
            }
          }
        }

        const rankedTypes = [...JOB_TYPE_ORDER]
          .sort((a, b) => {
            if (a === winnerId) return -1;
            if (b === winnerId) return 1;
            return scores[b] - scores[a];
          })
          .map((id) => ({
            profile: JOB_TYPES[id],
            score: scores[id],
          }));

        return {
          primaryType: JOB_TYPES[winnerId],
          scores,
          rankedTypes,
        };
      }

              badge.classList.add('bg-sky-600', 'text-white');
              badge.innerHTML =
                '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
            }

            setTimeout(() => {
              state.answers[question.id] = selectedType;
              if (state.currentIndex + 1 < QUESTIONS.length) {
                state.currentIndex += 1;
              } else {
                state.screen = 'result';
              }
              render();
            }, 320);
          });
        });
      }

      // 7. 결과 화면 렌더링
      function renderResultScreen() {
        const result = calculateResult(state.answers);
        const { primaryType, rankedTypes } = result;

        const recommendationsHtml = primaryType.recommendations
          .map(
            (item, idx) => `
              <li class="rounded-2xl bg-sky-50/60 p-4 sm:p-5 flex items-start gap-3.5">
                <span class="w-7 h-7 rounded-xl bg-white border border-sky-200/80 text-sky-700 font-display tabular-nums text-xs font-bold flex items-center justify-center shrink-0 mt-0.5" aria-hidden="true">
                  0${idx + 1}
                </span>
                <div class="min-w-0 flex-1">
                  <div class="flex flex-wrap items-baseline gap-x-2 gap-y-0.5">
                    <span class="text-base font-bold text-slate-900">${item.name}</span>
                    <span class="text-xs font-semibold text-sky-700">${item.kind}</span>
                  </div>
                  <p class="mt-1 text-sm text-slate-600 leading-relaxed">${item.reason}</p>
                </div>
              </li>
            `
          )
          .join('');

        const barsHtml = rankedTypes
          .map(({ profile, score }) => {
            const isWinner = profile.id === primaryType.id;
            const widthPct = Math.round((score / 6) * 100);
            return `
              <div class="space-y-1.5">
                <div class="flex items-center justify-between text-sm">
                  <span class="${isWinner ? 'font-bold text-slate-900' : 'font-medium text-slate-600'}">
                    ${profile.title}
                  </span>
                  <span class="font-display tabular-nums text-xs font-semibold text-slate-500">
                    ${score}/6회 선택
                  </span>
                </div>
                <div class="h-2 w-full bg-sky-100/80 rounded-full overflow-hidden">
                  <div class="h-full rounded-full ${isWinner ? 'bg-sky-500' : 'bg-sky-300'}" style="width: ${widthPct}%"></div>
                </div>
              </div>
            `;
          })
          .join('');

        const synergyHtml = primaryType.synergyPartners
          .map((partner) => {
            const p = JOB_TYPES[partner.id];
            return `
              <div class="rounded-2xl bg-sky-50/55 p-4 sm:p-5 flex items-start gap-4">
                <div class="w-14 h-14 rounded-xl overflow-hidden bg-white border border-sky-100 shrink-0">
                  ${getTypeIllustrationSvg(p.id)}
                </div>
                <div class="min-w-0 flex-1">
                  <h3 class="text-base font-bold text-slate-900">${p.title}</h3>
                  <p class="mt-0.5 text-xs font-medium text-sky-700">${p.relatedRoles[0]}</p>
                  <p class="mt-2 text-sm text-slate-600 leading-relaxed">${partner.reason}</p>
                </div>
              </div>
            `;
          })
          .join('');

        const otherTabsHtml = JOB_TYPE_ORDER.filter((id) => id !== primaryType.id)
          .map((id) => {
            const job = JOB_TYPES[id];
            const isSelected = state.previewTypeId === id;
            return `
              <button
                type="button"
                data-preview-id="${id}"
                class="preview-type-btn min-h-[38px] px-3 py-1.5 text-xs font-semibold rounded-lg transition-colors cursor-pointer whitespace-nowrap shrink-0 ${
                  isSelected ? 'bg-white text-sky-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                }"
              >
                ${job.title}
              </button>
            `;
          })
          .join('');

        const previewProfile = state.previewTypeId ? JOB_TYPES[state.previewTypeId] : null;

        appRoot.innerHTML = `
          <section class="w-full max-w-3xl mx-auto space-y-6 animate-screen-enter">
            <!-- PNG 캡처 영역 -->
            <div id="capture-target" class="space-y-5">
              <div class="bg-white rounded-3xl border border-sky-100 shadow-[0_16px_44px_-16px_rgba(14,165,233,0.22)] p-6 sm:p-10 space-y-8">
                <div class="flex flex-col sm:flex-row items-center sm:items-start gap-6 sm:gap-8">
                  <div class="w-36 h-36 sm:w-44 sm:h-44 rounded-2xl overflow-hidden bg-sky-50 border border-sky-100 shrink-0">
                    ${getTypeIllustrationSvg(primaryType.id)}
                  </div>

                  <div class="flex-1 text-center sm:text-left">
                    <p class="text-xs sm:text-sm font-semibold text-sky-700">
                      테스트 결과 · 나와 가장 잘 맞는 직무 유형
                    </p>
                    <h1 class="mt-1.5 text-3xl sm:text-4xl font-bold tracking-tight text-slate-900">
                      ${primaryType.title}
                    </h1>
                    <p class="mt-2.5 text-base sm:text-lg font-semibold text-sky-700 leading-snug">
                      “${primaryType.nickname}”
                    </p>
                    <div class="mt-3 text-xs sm:text-sm text-slate-500 flex flex-wrap items-center justify-center sm:justify-start gap-x-2 gap-y-1">
                      <span>대표 직무</span>
                      <span aria-hidden="true" class="text-sky-300">·</span>
                      <span>${primaryType.relatedRoles.join(' · ')}</span>
                    </div>
                  </div>
                </div>

                <p class="text-[15px] sm:text-base text-slate-700 leading-[1.75]">
                  ${primaryType.description}
                </p>

                <div class="pt-7 border-t border-sky-100">
                  <h2 class="text-lg sm:text-xl font-bold text-slate-900">
                    지금 준비하면 좋은 자격증 · 과목 3가지
                  </h2>
                  <ul class="mt-4 space-y-3">${recommendationsHtml}</ul>
                </div>

                <div class="pt-7 border-t border-sky-100">
                  <h2 class="text-sm font-semibold text-slate-700">
                    동아리 활동 12문항으로 본 나의 일 스타일 분포
                  </h2>
                  <div class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-x-8 gap-y-3.5">
                    ${barsHtml}
                  </div>
                </div>
              </div>

              <!-- 시너지 직무 유형 2가지 -->
              <div class="bg-white rounded-3xl border border-sky-100 shadow-[0_14px_38px_-16px_rgba(14,165,233,0.18)] p-6 sm:p-8">
                <h2 class="text-lg font-bold text-slate-900">
                  함께 일하면 시너지가 좋은 직무 유형 2가지
                </h2>
                <p class="mt-1.5 text-sm text-slate-500">
                  동아리나 팀 프로젝트를 함께 꾸릴 때, 아래 유형의 동료와 호흡이 특히 잘 맞아요.
                </p>
                <div class="mt-5 grid grid-cols-1 sm:grid-cols-2 gap-4">
                  ${synergyHtml}
                </div>
              </div>
            </div>

            <!-- 버튼 영역 -->
            <div class="bg-white rounded-3xl border border-sky-100 shadow-[0_12px_32px_-16px_rgba(14,165,233,0.16)] p-5 sm:p-6 space-y-3">
              <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                <button
                  type="button"
                  id="download-png-btn"
                  class="min-h-[50px] px-6 py-3 rounded-2xl bg-sky-600 hover:bg-sky-700 active:scale-[0.97] text-white font-semibold text-base shadow-[0_8px_20px_-6px_rgba(2,132,199,0.45)] flex items-center justify-center gap-2 transition-all cursor-pointer whitespace-nowrap shrink-0"
                >
                  <span>결과 PNG 이미지 저장</span>
                </button>

                <button
                  type="button"
                  id="copy-summary-btn"
                  class="min-h-[50px] px-5 py-3 rounded-2xl bg-sky-50 hover:bg-sky-100 text-sky-800 font-semibold text-sm flex items-center justify-center gap-2 transition-colors cursor-pointer whitespace-nowrap shrink-0"
                >
                  <span>결과 요약 복사</span>
                </button>

                <button
                  type="button"
                  id="restart-btn"
                  class="min-h-[50px] px-5 py-3 rounded-2xl border border-sky-200 bg-white hover:bg-sky-50 text-slate-700 font-semibold text-sm flex items-center justify-center gap-2 transition-colors cursor-pointer whitespace-nowrap shrink-0 sm:ml-auto"
                >
                  <span>다시 하기</span>
                </button>
              </div>
              <p id="download-error-msg" class="hidden text-xs font-medium text-rose-600" role="alert"></p>
            </div>

            <!-- 다른 직무 유형 둘러보기 -->
            <div class="bg-white/85 rounded-3xl border border-sky-100 p-5 sm:p-6">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <p class="text-sm font-semibold text-slate-800">다른 직무 유형도 궁금하다면?</p>
                <div class="flex flex-wrap items-center gap-1.5 p-1 bg-sky-50 rounded-xl">
                  ${otherTabsHtml}
                </div>
              </div>
              ${
                previewProfile
                  ? `<div class="mt-4 pt-4 border-t border-sky-100 text-sm space-y-2">
                      <div class="flex flex-wrap items-baseline gap-2">
                        <span class="font-bold text-slate-900">${previewProfile.title}</span>
                        <span class="text-sky-700 font-medium">“${previewProfile.nickname}”</span>
                      </div>
                      <p class="text-slate-600 leading-relaxed">${previewProfile.description}</p>
                      <p class="text-xs text-slate-500 pt-1">
                        추천 준비: ${previewProfile.recommendations.map((r) => r.name).join(' · ')}
                      </p>
                    </div>`
                  : ''
              }
            </div>
          </section>
        `;

        // 다시 하기
        document.getElementById('restart-btn').addEventListener('click', resetTest);

        // 결과 요약 복사
        const copyBtn = document.getElementById('copy-summary-btn');
        copyBtn.addEventListener('click', async () => {
          const synergyNames = primaryType.synergyPartners
            .map((p) => JOB_TYPES[p.id].title)
            .join(', ');
          const text = [
            '[나에게 맞는 직무 유형 테스트 결과]',
            `나의 직무 유형: ${primaryType.title}`,
            `"${primaryType.nickname}"`,
            '',
            primaryType.description,
            '',
            '추천 자격증·과목:',
            ...primaryType.recommendations.map((r, i) => `${i + 1}. ${r.name} (${r.kind})`),
            '',
            `함께 일하면 시너지가 좋은 직무 유형: ${synergyNames}`,
          ].join('\n');

          try {
            await navigator.clipboard.writeText(text);
            copyBtn.innerHTML = '<span>결과가 복사되었어요</span>';
            setTimeout(() => {
              copyBtn.innerHTML = '<span>결과 요약 복사</span>';
            }, 2000);
          } catch {
            // 클립보드 권한이 제한된 환경은 무시
          }
        });

        // PNG 이미지 저장
        const downloadBtn = document.getElementById('download-png-btn');
        const downloadErrorEl = document.getElementById('download-error-msg');
        downloadBtn.addEventListener('click', async () => {
          const target = document.getElementById('capture-target');
          if (!target || !window.htmlToImage) {
            downloadErrorEl.textContent = '이미지 저장 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.';
            downloadErrorEl.classList.remove('hidden');
            return;
          }

          downloadBtn.disabled = true;
          downloadBtn.innerHTML = '<span>이미지 만드는 중...</span>';
          downloadErrorEl.classList.add('hidden');

          try {
            if (document.fonts && document.fonts.ready) {
              await document.fonts.ready;
            }
            const dataUrl = await window.htmlToImage.toPng(target, {
              pixelRatio: 2,
              backgroundColor: '#f0f9ff',
              style: { padding: '20px' },
            });
            const link = document.createElement('a');
            link.download = `직무유형테스트_${primaryType.title.replace(/\s+/g, '_')}.png`;
            link.href = dataUrl;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            downloadBtn.innerHTML = '<span>PNG로 저장되었어요</span>';
            setTimeout(() => {
              downloadBtn.innerHTML = '<span>결과 PNG 이미지 저장</span>';
            }, 2500);
          } catch {
            downloadErrorEl.textContent = '이미지 저장 중 문제가 발생했어요. 다시 시도해 주세요.';
            downloadErrorEl.classList.remove('hidden');
            downloadBtn.innerHTML = '<span>결과 PNG 이미지 저장</span>';
          } finally {
            downloadBtn.disabled = false;
          }
        });

        // 다른 직무 유형 미리보기 토글
        document.querySelectorAll('.preview-type-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-preview-id');
            state.previewTypeId = state.previewTypeId === id ? null : id;
            renderResultScreen();
          });
        });
      }

      // 초기 화면 렌더링
      render();
    </script>
  </body>
</html>
